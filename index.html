<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131a">
  <title>그림자 퍼즐 — Stage 1</title>
  <link rel="stylesheet" href="style-v30.css">
  <link rel="stylesheet" href="animation-v1.css?v=5">
  <link rel="stylesheet" href="game-ui-v1.css?v=9">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">SHADOW PUZZLE · PROTOTYPE</p>
        <h1 id="stageTitle">Stage 1 — 장애물 장벽</h1>
      </div>
      <div class="header-actions"><a class="ghost nav-link" href="editor.html">맵 에디터</a><button id="restoreStagesButton" class="ghost" hidden>기본 스테이지 복원</button><button id="resetButton" class="ghost">처음부터</button></div>
    </header>

    <section class="status" aria-live="polite">
      <div><span>턴</span><strong id="turnCount">0</strong></div>
      <div><span>그림자</span><strong id="shadowTurns">없음</strong></div>
      <div class="message" id="message">걸어서는 나갈 수 없습니다. 그림자를 만들어 보세요.</div>
    </section>

    <div class="layout">
      <section class="board-panel">
        <div id="board" class="board" role="grid" aria-label="Stage 1 격자"></div>
      </section>

      <aside class="controls">
        <section class="play-controls">
          <div class="mobile-control-deck">
            <div class="movement-side">
              <div class="movement-pad">
                <button class="move-up" data-move="up" aria-label="위로 이동">▲</button>
                <button class="move-left" data-move="left" aria-label="왼쪽으로 이동">◀</button>
                <button class="move-right" data-move="right" aria-label="오른쪽으로 이동">▶</button>
                <button class="move-down" data-move="down" aria-label="아래로 이동">▼</button>
              </div>
            </div>
            <div class="skills-side">
              <div class="skill-pad">
                <button id="shadowButton" class="primary shadow-action" aria-label="그림자 행동"><img class="skill-icon" src="assets/icons/shadow-mark.svg" alt=""><span>그림자</span></button>
                <button id="shurikenButton" class="skill-slot shuriken-action" aria-label="바라보는 방향으로 표창 던지기"><img class="skill-icon" src="assets/icons/shuriken-mark.svg" alt=""><span>표창</span></button>
              </div>
            </div>
          </div>
          <button id="cancelShadowButton" class="cancel-shadow" hidden aria-hidden="true">생성 취소</button>
          <button id="swapButton" hidden disabled aria-hidden="true">그림자와 스왑</button>
        </section>
      </aside>
    </div>
  </main>
  <div id="gameOverModal" class="game-over-modal" hidden>
    <section class="game-over-card" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
      <p class="eyebrow">NO ROUTE REMAINS</p>
      <h2 id="gameOverTitle">게임 오버</h2>
      <p>현재 위치와 남은 그림자 행동으로는 출구에 도달할 수 없습니다.</p>
      <div class="game-over-actions">
        <button id="restartGameButton" class="primary">재시작</button>
        <button id="endGameButton">종료</button>
      </div>
    </section>
  </div>
  <script src="game-v34.js?v=19"></script>
</body>
</html>
